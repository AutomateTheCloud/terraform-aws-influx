# Trivy findings that are deliberate. Each entry says why.
misconfigurations:
  - id: AWS-0178
    paths:
      - tests/fixtures/same_run/main.tf
    statement: >-
      The test fixture creates a VPC only so that its ID, and the subnets' IDs, are
      unknown when the module plans. It runs against a mocked provider and is never
      applied. The module itself creates no VPC.
  - id: AWS-0132
    paths:
      - examples/complete/main.tf
    statement: >-
      The example's log bucket uses SSE-S3 encryption. Timestream for InfluxDB
      delivers logs as its service principal, and AWS documents only the bucket policy
      it needs, not a KMS key grant, so a bucket encrypted with a customer managed key
      may refuse its writes. The logs hold InfluxDB engine messages. The module itself
      creates no bucket.
